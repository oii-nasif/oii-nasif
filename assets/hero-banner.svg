<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.55" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .title { font-size: 28px; font-weight: 800; fill: #0F172A; letter-spacing: -0.4px; }
    .subtitle { font-size: 20px; font-weight: 700; fill: #1E293B; }
    .role { font-size: 14px; font-weight: 600; fill: #0369A1; }
    .bio { font-size: 13px; font-weight: 400; fill: #475569; }
    .status-text { font-size: 10.5px; font-weight: 700; fill: #0369A1; letter-spacing: 0.5px; }
    .stat-num { font-size: 17.5px; font-weight: 800; fill: #0F172A; }
    .stat-label { font-size: 10.5px; font-weight: 700; fill: #475569; text-transform: uppercase; letter-spacing: 0.3px; }
    .stat-sub { font-size: 10px; font-weight: 400; fill: #94A3B8; }
    .pulse {
      animation: pulseAnim 2.2s infinite ease-in-out;
      transform-origin: center;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Outer Card -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subtle Dot Grid Pattern on Right -->
  <rect x="520" y="4" width="376" height="212" rx="12" fill="url(#grid)" />

  <!-- Top Accent Strip -->
  <path d="M 16 2.5 L 884 2.5 A 13.5 13.5 0 0 1 897.5 16 L 897.5 7 L 2.5 7 L 2.5 16 A 13.5 13.5 0 0 1 16 2.5 Z" fill="url(#accentGrad)" />

  <!-- Status Pill -->
  <rect x="32" y="26" width="376" height="24" rx="12" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
  <circle cx="46" cy="38" r="4" fill="#0284C7" class="pulse" />
  <text x="58" y="42" class="font-mono status-text">OPEN TO BACKEND &amp; PLATFORM ROLES · DHAKA, BD</text>

  <!-- Main Heading & Tagline -->
  <text x="32" y="83" class="font-sans title">Nasif</text>
  <line x1="116" y1="63" x2="116" y2="85" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <text x="130" y="82" class="font-sans subtitle">Senior Software Engineer</text>

  <text x="32" y="110" class="font-sans role">Brain Station 23  ·  .NET 8  ·  C#  ·  ASP.NET Core  ·  Azure  ·  Distributed Systems</text>

  <text x="32" y="136" class="font-sans bio">4+ years shipping enterprise .NET systems — multi-tenant risk analytics,</text>
  <text x="32" y="155" class="font-sans bio">regulatory reporting, and real-time pipelines for regulated industries.</text>

  <!-- Bottom Tech Pill Tags (Ends at x=530, well clear of x=578) -->
  <g transform="translate(32, 173)">
    <rect x="0" y="0" width="124" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="62" y="16" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">Clean Architecture</text>

    <rect x="132" y="0" width="128" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="196" y="16" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">SignalR &amp; Hangfire</text>

    <rect x="268" y="0" width="116" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="326" y="16" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">Redis &amp; SQL</text>

    <rect x="392" y="0" width="116" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="450" y="16" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#334155">Azure &amp; Fabric</text>
  </g>

  <!-- Right Side Executive Metric Bento Cards (2x2) starting at x=578 -->
  <g transform="translate(578, 26)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="142" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#0284C7" />
    <text x="16" y="32" class="font-sans stat-num">4+ Years</text>
    <text x="16" y="51" class="font-sans stat-label">Enterprise .NET</text>
    <text x="16" y="66" class="font-sans stat-sub">Production Systems</text>

    <!-- Card 2 -->
    <rect x="152" y="0" width="142" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="152" y="0" width="4" height="78" rx="2" fill="#2563EB" />
    <text x="168" y="32" class="font-sans stat-num">150+ APIs</text>
    <text x="168" y="51" class="font-sans stat-label">243 Entities</text>
    <text x="168" y="66" class="font-sans stat-sub">ClarusRisk Platform</text>

    <!-- Card 3 -->
    <rect x="0" y="90" width="142" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="0" y="90" width="4" height="78" rx="2" fill="#0EA5E9" />
    <text x="16" y="122" class="font-sans stat-num">6× Certified</text>
    <text x="16" y="141" class="font-sans stat-label">MS &amp; GitHub</text>
    <text x="16" y="156" class="font-sans stat-sub">AI · Fabric · Actions</text>

    <!-- Card 4 -->
    <rect x="152" y="90" width="142" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="152" y="90" width="4" height="78" rx="2" fill="#0369A1" />
    <text x="168" y="122" class="font-sans stat-num">2× ICPC</text>
    <text x="168" y="141" class="font-sans stat-label">Hon. Mention</text>
    <text x="168" y="156" class="font-sans stat-sub">Dhaka Prelim '18, '20</text>
  </g>
</svg>
