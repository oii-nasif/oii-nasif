<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" opacity="0.55" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .title { font-size: 30px; font-weight: 800; fill: #0F172A; letter-spacing: -0.5px; }
    .role { font-size: 16px; font-weight: 600; fill: #0369A1; }
    .bio { font-size: 13.5px; font-weight: 400; fill: #475569; }
    .status-text { font-size: 11px; font-weight: 700; fill: #0369A1; letter-spacing: 0.6px; }
    .stat-num { font-size: 20px; font-weight: 800; fill: #0F172A; }
    .stat-label { font-size: 11px; font-weight: 600; fill: #64748B; text-transform: uppercase; letter-spacing: 0.4px; }
    .pulse {
      animation: pulseAnim 2.2s infinite ease-in-out;
      transform-origin: center;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Outer Card -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subtle Dot Grid Pattern on Right -->
  <rect x="460" y="4" width="436" height="212" rx="12" fill="url(#grid)" />

  <!-- Top Accent Strip -->
  <path d="M 16 2.5 L 884 2.5 A 13.5 13.5 0 0 1 897.5 16 L 897.5 7 L 2.5 7 L 2.5 16 A 13.5 13.5 0 0 1 16 2.5 Z" fill="url(#accentGrad)" />

  <!-- Status Pill -->
  <rect x="34" y="26" width="388" height="24" rx="12" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" />
  <circle cx="48" cy="38" r="4" fill="#0284C7" class="pulse" />
  <text x="60" y="42" class="font-mono status-text">OPEN TO BACKEND &amp; PLATFORM ROLES · DHAKA, BD</text>

  <!-- Main Heading & Tagline -->
  <text x="34" y="84" class="font-sans title">Nasif</text>
  <text x="118" y="84" class="font-sans" font-size="28" font-weight="300" fill="#94A3B8">—</text>
  <text x="148" y="84" class="font-sans" font-size="22" font-weight="700" fill="#1E293B">Senior Software Engineer</text>

  <text x="34" y="112" class="font-sans role">Brain Station 23  ·  .NET 8  ·  C#  ·  ASP.NET Core  ·  Microsoft Azure  ·  Distributed Systems</text>

  <text x="34" y="138" class="font-sans bio">4+ years shipping enterprise .NET platforms — multi-tenant risk analytics, automated regulatory</text>
  <text x="34" y="158" class="font-sans bio">reporting, and high-throughput real-time pipelines built for regulated financial industries.</text>

  <!-- Bottom Tech Pill Tags -->
  <g transform="translate(34, 174)">
    <rect x="0" y="0" width="132" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="66" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#334155">Clean Architecture</text>

    <rect x="140" y="0" width="136" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="208" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#334155">SignalR &amp; Hangfire</text>

    <rect x="284" y="0" width="122" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="345" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#334155">Redis &amp; SQL Server</text>

    <rect x="414" y="0" width="128" height="24" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="478" y="16" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#334155">Azure &amp; Fabric</text>
  </g>

  <!-- Right Side Executive Metric Bento Cards (2x2) -->
  <g transform="translate(595, 26)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="132" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="78" rx="2" fill="#0284C7" />
    <text x="16" y="34" class="font-sans stat-num">4+ Years</text>
    <text x="16" y="54" class="font-sans stat-label">Enterprise .NET</text>
    <text x="16" y="67" class="font-sans" font-size="10" fill="#94A3B8">Production Systems</text>

    <!-- Card 2 -->
    <rect x="142" y="0" width="132" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="142" y="0" width="4" height="78" rx="2" fill="#2563EB" />
    <text x="158" y="34" class="font-sans stat-num">150+ APIs</text>
    <text x="158" y="54" class="font-sans stat-label">243 Entities</text>
    <text x="158" y="67" class="font-sans" font-size="10" fill="#94A3B8">ClarusRisk Platform</text>

    <!-- Card 3 -->
    <rect x="0" y="90" width="132" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="0" y="90" width="4" height="78" rx="2" fill="#0EA5E9" />
    <text x="16" y="124" class="font-sans stat-num">6× Certified</text>
    <text x="16" y="144" class="font-sans stat-label">MS &amp; GitHub</text>
    <text x="16" y="157" class="font-sans" font-size="10" fill="#94A3B8">AI · Fabric · Actions</text>

    <!-- Card 4 -->
    <rect x="142" y="90" width="132" height="78" rx="10" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="1.2" />
    <rect x="142" y="90" width="4" height="78" rx="2" fill="#0369A1" />
    <text x="158" y="124" class="font-sans stat-num">2× ICPC</text>
    <text x="158" y="144" class="font-sans stat-label">Hon. Mention</text>
    <text x="158" y="157" class="font-sans" font-size="10" fill="#94A3B8">Dhaka Prelim '18, '20</text>
  </g>
</svg>
